version: "2"

sql:
  - engine: "postgresql"
    schema: "db/migrations"
    queries: "db/query/**/*.sql"
    
    gen:
      go:
        package: "sqlc"
        out: "internal/infrastructure/postgres/sqlc"
        sql_package: "pgx/v5"

        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
